<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maya Login</title>
    <meta name="description" content="Maya login page" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone-shell">
      <header class="status-bar" aria-label="Status bar">
        <div class="time">1:19 PM</div>
        <div class="status-icons" aria-hidden="true">
          <span class="signal signal-1"></span>
          <span class="signal signal-2"></span>
          <span class="signal signal-3"></span>
          <span class="signal signal-4"></span>
          <span class="wifi"></span>
          <span class="battery"><span class="battery-level"></span></span>
          <span class="battery-number">15.5</span>
        </div>
      </header>

      <nav class="top-nav" aria-label="Main navigation">
        <button class="nav-back" type="button" aria-label="Go back">←</button>
        <button class="nav-help" type="button" aria-label="Help">
          <span class="help-mark">?</span>
          <span>help</span>
        </button>
      </nav>

      <main class="login-screen">
        <div class="brand" aria-label="Maya">maya</div>

        <div class="login-form" role="form" aria-label="Login form">
          <div class="field-group phone-field">
            <span class="country-code">+63</span>
            <input type="tel" inputmode="numeric" placeholder="Phone number" aria-label="Phone number" />
          </div>

          <div class="field-group password-field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" type="password" placeholder="Enter password" aria-label="Password" />
              <button type="button" class="eye-button" aria-label="Show password">
                <span class="eye-icon" aria-hidden="true">
                  <span class="eye-lid"></span>
                </span>
              </button>
            </div>
          </div>

          <a href="#" class="forgot-link">Forgot your password?</a>
        </div>

        <button class="login-button" type="submit">Log in</button>
      </main>
    </div>
  </body>
</html>
